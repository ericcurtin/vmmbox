name: Release

# Pushing a tag vX.Y.Z builds the binaries, publishes a GitHub release with their
# checksums, and updates the Homebrew tap and Scoop bucket to point at them.
# The tag must match the version in Cargo.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: vmmbox-aarch64-apple-darwin
            native: true
          # musl: a static binary that runs on any Linux, whatever its glibc.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: vmmbox-x86_64-unknown-linux-musl
            native: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: vmmbox-x86_64-pc-windows-msvc.exe
            native: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{gsub(/^[^"]*"|".*$/,"");print;exit}' Cargo.toml)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate; bump Cargo.toml and retag"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage
        shell: bash
        run: |
          mkdir dist
          bin=vmmbox
          case "${{ matrix.target }}" in *windows*) bin=vmmbox.exe ;; esac
          cp "target/${{ matrix.target }}/release/$bin" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      # Run what we ship, where we can: the binary must report the tag's version.
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          want="vmmbox ${GITHUB_REF_NAME#v}"
          got="$("dist/${{ matrix.asset }}" --version)"
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::expected '$want'"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Homebrew and Scoop verify against these hashes, and the packages are
      # rendered from this same file, so they cannot disagree with the binaries.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum vmmbox-* | tee ../checksums.txt
          mv ../checksums.txt .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checksums
          path: dist/checksums.txt
          if-no-files-found: error

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # A re-run after a partial failure must not fail on the existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "vmmbox $VERSION" --generate-notes
          fi

  publish-packages:
    name: Publish ${{ matrix.name }}
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Homebrew formula
            id: homebrew
            repo: ericcurtin/homebrew-tap
            # The version appears only in the download URL.
            file: Formula/vmmbox.rb
            version_sed: 's|.*/releases/download/v\([0-9.]*\)/.*|\1|p'
          - name: Scoop manifest
            id: scoop
            repo: ericcurtin/scoop-bucket
            file: bucket/vmmbox.json
            version_sed: 's/^    "version": "\(.*\)",$/\1/p'
    # Queue, never cancel: two close releases must not interleave their pushes.
    concurrency:
      group: publish-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      # Pushing to another repository needs a token with write access to it;
      # the default GITHUB_TOKEN only covers this repository.
      - name: Require the tap token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::secret TAP_GITHUB_TOKEN is not set. Create a fine-grained token with Contents: read and write on ericcurtin/homebrew-tap and ericcurtin/scoop-bucket, add it as a repository secret, then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-checksums

      - name: Render
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          packaging/render.sh \
            --version "$VERSION" \
            --checksums checksums.txt \
            --out-dir rendered

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: target-repo

      - name: Commit and push
        working-directory: target-repo
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SRC: ${{ github.sha }}
          PKG: ${{ matrix.id }}
          REPO: ${{ matrix.repo }}
          FILE: ${{ matrix.file }}
          VERSION_SED: ${{ matrix.version_sed }}
        run: |
          set -euo pipefail
          git config user.name "vmmbox-ci"
          git config user.email "vmmbox-ci@users.noreply.github.com"
          branch="$(git symbolic-ref --quiet --short HEAD || true)"
          if [ -z "$branch" ]; then
            branch="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          fi

          # Generated output: on a rejected push, re-sync and regenerate on top
          # rather than rebase.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$branch"
            git reset --quiet --hard FETCH_HEAD

            # Never downgrade: two releases can finish out of order.
            if [ -f "$FILE" ]; then
              have="$(sed -n "$VERSION_SED" "$FILE" | head -n1)"
              if [ -n "$have" ] && [ "$have" != "$VERSION" ] \
                 && [ "$(printf '%s\n%s\n' "$have" "$VERSION" | sort -V | tail -n1)" = "$have" ]; then
                echo "::notice::$REPO already has vmmbox $have, newer than $VERSION; leaving it"
                exit 0
              fi
            fi

            cp -R "../rendered/$PKG/." .
            git add -A .
            if git diff --cached --quiet; then
              echo "::notice::$REPO already up to date for $VERSION"
              exit 0
            fi

            git commit --quiet -m "vmmbox $VERSION" \
              -m "Generated from ${{ github.repository }}@$SRC by packaging/render.sh."
            if git push --quiet origin "HEAD:$branch"; then
              echo "Pushed vmmbox $VERSION to $REPO"
              exit 0
            fi
            echo "::warning::push to $REPO rejected (attempt $attempt/5); re-syncing"
            sleep "$((attempt * 3))"
          done
          echo "::error::could not push vmmbox $VERSION to $REPO after 5 attempts"
          exit 1
